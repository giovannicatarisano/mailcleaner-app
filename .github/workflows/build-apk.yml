name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # serve per creare Release e caricare assets

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MailCleaner.apk

      # ── Carica l'APK anche come Release per link diretto ──
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Delete existing latest release (if exists)
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MailCleaner Android — Build ${{ steps.date.outputs.date }}"
          body: |
            ## 📲 MailCleaner per Android

            Scarica e installa direttamente sul tuo Android.

            **Istruzioni installazione:**
            1. Scarica `MailCleaner.apk` qui sotto
            2. Sul telefono: *Impostazioni → App → Installa app sconosciute*
            3. Apri il file APK scaricato e installa

            ---
            *Build automatico — aggiornato ad ogni push su main*
          files: MailCleaner.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload anche come artifact per backup ──
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailCleaner-Android-APK
          path: MailCleaner.apk
          retention-days: 30
